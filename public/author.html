<style>
  :root{
    --bg: #F4EDE0; --panel: #FFFCF5; --line: #2A2620; --text: #22201C; --muted: #6B5C4B;
    --accent: #1B3A5C; --accent2: #C9A646; --pink: #C1440E; --good: #1B3A5C; --warn: #C9A646; --bad: #A6321B;
    --coin: var(--accent2); --shadow: none; --shadow-lg: none; --shadow-sm: none; --radius: 0; --radius-md: 0;
    --stroke: 1.5px solid var(--line);
    --font-display: 'Yuji Syuku', 'Shippori Mincho', serif;
    --font-body: 'Noto Sans JP', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0; font-family: var(--font-body); color:var(--text); background:var(--bg);}

  a{color:inherit;text-decoration:none}

  /* ========== レイアウト全体: 左サイドバー + メインエリア ========== */
  .app-shell{display:flex;min-height:100vh}

  .sidebar{
    width:226px;flex:none;
    display:flex;flex-direction:column;
    padding:20px 14px;
    background: var(--panel);
    border-right: var(--stroke);
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;cursor:pointer;flex:none; font-family: var(--font-display); padding:0 10px 18px}
  .logo-mark{
    width:36px;height:36px;border-radius:0;
    border:none;
    object-fit: cover;
    display:block;
  }
  .logo .sub{font-size:10px;font-weight:700;color:var(--muted);display:block;letter-spacing:.03em; font-family: var(--font-body)}

  .sidebar-nav{display:flex;flex-direction:column;gap:2px}
  .side-link{
    text-align:left;
    padding:11px 14px;
    border-radius:0;
    background: transparent;
    border:none;
    font-size:13.5px;
    color: var(--text);
    font-weight: 800;
    transition: background .15s ease, color .15s ease;
    display:block;
  }
  .side-link:hover{
    background: var(--accent);
    color: #fff;
  }
  .sidebar-spacer{flex:1}

  .main-area{flex:1;min-width:0}
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:12px;
    padding:14px 24px;
    background: var(--panel);
    border-bottom: var(--stroke);
  }
  .hd-spacer{flex:1}
  .topbar h1{margin:0;font-size:16px;font-family: var(--font-display)}

  .nav-btn{
    font-size: 13px; font-weight: 800; border: var(--stroke);
    border-radius: 0; padding: 9px 18px; background: var(--panel);
    box-shadow:none; cursor: pointer; text-decoration: none; color: var(--text);
    transition: background .15s ease;
  }
  .nav-btn:hover{ background: var(--bg); }

  /* --- 創作ドロップダウン --- */
  .create-menu{position:relative}
  .create-btn{
    width:100%;
    padding:11px 16px;
    border-radius:0;
    font-size:13.5px;
    color: #fff;
    background: var(--pink);
    border:none;
    font-weight: 800;
    cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;
    transition: background .15s ease;
  }
  .create-btn:hover{
    background:#A8390C;
  }
  .create-drop{
    position:absolute;left:0;right:0;top:calc(100% + 8px);min-width:210px;z-index:45;
    background: var(--panel);
    border: var(--stroke);
    border-radius:0;
    padding:10px;display:none;
  }
  .create-drop.open{display:block;animation:rise .18s ease}
  .create-drop .cd-head{
    font-size:12px;font-weight:800;color:var(--muted);
    padding:6px 12px 10px;border-bottom:1.5px dashed var(--line);margin-bottom:8px;
  }
  .create-drop .cd-item{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:10px 12px;border-radius:0;font-size:13px;font-weight:800;cursor:pointer;
    border:none;background:transparent;text-align:left;
    text-decoration:none;color:var(--text);
    transition: background .15s ease, color .15s ease;
  }
  .create-drop .cd-item:hover{background: var(--accent);color:#fff;}
  .create-drop .cd-item .cd-desc{
    font-size:11px;font-weight:400;color:var(--muted);display:block;margin-top:1px;
  }
  .create-drop .cd-item:hover .cd-desc{color:#fff;}
  @keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

  .container{ max-width: 1100px; margin: 0 auto; padding: 32px 20px; }

  /* プロフィールカード */
  .profile-card{
    background: var(--panel); border: var(--stroke); border-radius: 0;
    padding: 30px; box-shadow:none; margin-bottom: 40px;
    display: flex; gap: 24px; align-items: center;
  }
  .profile-avatar{
    width: 90px; height: 90px; border-radius: 999px; border: var(--stroke);
    display: grid; place-items: center; font-size: 40px; font-weight: 800; color: #FFF;
    flex-shrink: 0; box-shadow:none;
  }
  .profile-info{ flex: 1; }
  .profile-name{ font-family: var(--font-display); font-size: 24px; margin: 0 0 8px 0; }
  .profile-bio{ font-size: 14px; color: var(--muted); margin: 0; line-height: 1.6; font-weight: 700; }

  /* からくり人形エリア */
  .fam-box{
    display: flex; align-items: center; gap: 12px; margin-top: 16px;
    padding: 10px 14px; background: #FBF3E1; border: var(--stroke); border-radius: 0;
  }
  .fam-icon{ font-size: 28px; }
  .fam-name{ font-weight: 800; font-size: 12px; color: var(--muted); }
  .fam-msg{ font-size: 13px; font-weight: 700; margin: 2px 0 0 0; }

  /* セクションタイトル */
  .section-title{ font-family: var(--font-display); font-size: 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;}

  /* ========== Cards (civitai-style) ========== */
  .works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
  .card{
    background: var(--panel);
    border:none;
    border-radius:0;
    overflow:hidden;
    cursor:pointer;
    transition: transform 0.15s ease;
  }
  .card:hover{
    transform: translateY(-3px);
  }
  .thumb{
    position:relative;aspect-ratio:4/3;display:grid;place-items:center;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-overlay{
    position:absolute;left:0;right:0;bottom:0;z-index:1;
    padding:30px 10px 8px;color:#fff;
    background:linear-gradient(to top, rgba(20,16,10,.88), rgba(20,16,10,.5) 65%, transparent);
  }
  .cf-title{font-size:13px;font-weight:800;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
  .cf-row{display:flex;justify-content:flex-end;align-items:center;font-size:11px;color:#fff;opacity:.92;font-weight:700}
  .cf-stats{display:flex;gap:8px}

  .empty-state{
    text-align: center; padding: 40px; background: var(--panel); border: var(--stroke);
    border-style: dashed;
    border-radius: 0; font-weight: 700; color: var(--muted); box-shadow:none;
  }

  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--panel); border: var(--stroke);
    border-radius: 0; padding: 12px 20px; box-shadow:none;
    z-index: 1000; transform: translateY(100px); opacity: 0; transition: .3s; font-weight: 700;
  }
  .toast.show { transform: none; opacity: 1; }

  @media (max-width:900px){
    .app-shell{flex-direction:column}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;align-items:center}
    .sidebar-nav{flex-direction:row;flex-wrap:wrap}
    .sidebar-spacer{display:none}
  }
</style>

<script>
  const $ = id => document.getElementById(id);

  /* 創作ドロップダウンメニューの開閉 */
  $('createBtn').addEventListener('click', e=>{
    e.stopPropagation();
    $('createDrop').classList.toggle('open');
  });
  document.addEventListener('click', e=>{
    if(!e.target.closest('#createMenu')) $('createDrop').classList.remove('open');
  });

  const DB_PREFIX = "otq:";
  const DB = {
    get(key, def) {
      try {
        const val = localStorage.getItem(DB_PREFIX + key);
        return val ? JSON.parse(val) : def;
      } catch(e) { return def; }
    },
    getCurrentUid() {
      return localStorage.getItem(DB_PREFIX + "current_uid");
    }
  };

  const FAM_TYPES = {
    tora: {
      emoji: '🏮',
      name: '灯',
      greet: '灯です。これから一緒に作品制作を進めましょう。',
      noHobby: '好きなものはまだ設定されていません。マイページから登録できます。',
      img: 'karakuri_1.svg'
    },
    robo: {
      emoji: '🧮',
      name: '算',
      greet: '解析完了。これより私がサポートを行います。',
      noHobby: 'すきなものは未設定です。マイページから登録を推奨します。',
      img: 'karakuri_2.svg'
    },
    fairy: {
      emoji: '🎐',
      name: '結',
      greet: '結です。一緒に制作を進めましょう。',
      noHobby: '好きなものはまだ設定されていません。マイページから登録できます。',
      img: 'karakuri_3.svg'
    },
    dragon: {
      emoji: '⚔️',
      name: '武',
      greet: 'よくぞ参った。これより共に学び、励むとしよう。',
      noHobby: 'すきなものはまだ設定されていないようだ。早う登録するがよい。',
      img: 'karakuri_4.svg'
    },
    rabbit: {
      emoji: '🔔',
      name: '鈴',
      greet: '鈴です。これから制作をサポートします。',
      noHobby: '好きなものはまだ設定されていません。マイページから登録できます。',
      img: 'karakuri_5.svg'
    }
  };

  function avatarColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    const colors = ['#1B3A5C', '#C1440E', '#C9A646', '#6B5C4B', '#3E5C56', '#7A5C6E', '#5C6B3E', '#A6321B'];
    return colors[Math.abs(hash) % colors.length];
  }

  function esc(s) {
    if(!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function famImg(key, size) {
    const f = FAM_TYPES[key] || FAM_TYPES.tora;
    if (f.img) {
      return `<img src="img/${f.img}" alt="${f.name}" style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle;" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${f.emoji}',style:'font-size:${Math.round(size*0.85)}px;line-height:1;'}))">`;
    }
    return `<span style="font-size:${Math.round(size*0.85)}px;line-height:1;">${f.emoji}</span>`;
  }

  let toastTimer = null;
  function showToast(msg, isError = false) {
    const el = document.getElementById('toastEl');
    el.textContent = msg;
    el.style.borderColor = isError ? 'var(--bad)' : 'var(--line)';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  let isInitialized = false;

  function applyUserBgStyle(bgType, bgColor, bgImage) {
    const type = bgType || 'color';
    const color = bgColor || '#F4EDE0';
    const image = bgImage || 'default';

    const body = document.body;
    body.style.backgroundImage = 'none';
    body.style.backgroundColor = '';
    body.style.background = '';
    body.style.backgroundSize = '';
    body.style.animation = '';
    body.style.backgroundAttachment = '';
    body.style.backgroundPosition = '';

    if (type === 'image' && image && image !== 'default') {
      const bgId = image.replace('.png', '');
      if (bgId === 'bg_rainbow') {
        body.style.background = 'linear-gradient(45deg, #ff007f, #ff7f00, #fffe00, #00ff7f, #007fff, #7f00ff, #ff007f)';
        body.style.backgroundSize = '400% 400%';
        body.style.animation = 'gradientBG 15s ease infinite';
      } else if (bgId === 'bg_space') {
        body.style.background = 'radial-gradient(circle, #1b1b3a 0%, #0d0d1e 100%)';
        body.style.backgroundAttachment = 'fixed';
      } else if (bgId === 'bg_ocean') {
        body.style.background = 'linear-gradient(180deg, #38bdf8 0%, #0284c7 100%)';
        body.style.backgroundAttachment = 'fixed';
      } else if (bgId === 'bg_forest') {
        body.style.background = 'linear-gradient(180deg, #34d399 0%, #059669 100%)';
        body.style.backgroundAttachment = 'fixed';
      } else if (bgId === 'bg_sunset') {
        body.style.background = 'linear-gradient(180deg, #fb923c 0%, #c2410c 100%)';
        body.style.backgroundAttachment = 'fixed';
      } else if (bgId === 'bg_cherry') {
        body.style.background = 'linear-gradient(180deg, #fbcfe8 0%, #f472b6 100%)';
        body.style.backgroundAttachment = 'fixed';
      } else {
        body.style.backgroundImage = `url('img/${bgId}.png')`;
        body.style.backgroundSize = 'cover';
        body.style.backgroundAttachment = 'fixed';
        body.style.backgroundPosition = 'center';
      }
    } else {
      body.style.backgroundColor = color;
    }
  }

  function calculateRank(learnedCount, worksCount, achievementsCount) {
    if (learnedCount >= 30 && worksCount >= 7 && achievementsCount >= 5) {
      return "プラチナランク";
    } else if (learnedCount >= 15 && worksCount >= 3 && achievementsCount >= 3) {
      return "ゴールドランク";
    } else if (learnedCount >= 5 && worksCount >= 1 && achievementsCount >= 1) {
      return "シルバーランク";
    } else {
      return "ブロンズランク";
    }
  }

  async function init() {
    if (isInitialized) return;
    const params = new URLSearchParams(location.search);
    const authorUid = params.get('uid')?.trim();

    if (!authorUid) {
      document.getElementById('loading').innerHTML = '❌ 作者の情報が見つかりませんでした。(UIDが指定されていません)';
      return;
    }

    if (!window.FirebaseAuthBridge?.isConfigured) {
      return;
    }

    isInitialized = true;
    try {
      // 1. プロフィールの読み込み
      const userDoc = await window.FirebaseAuthBridge.getFirestoreDoc('users', authorUid);
      let works = [];
      try {
        works = await window.FirebaseAuthBridge.getAuthorPublicWorks(authorUid);
      } catch (e) {
        console.warn('Failed to load public works:', e);
      }

      if (userDoc) {
        // 背景同期
        applyUserBgStyle(userDoc.bgType, userDoc.bgColor, userDoc.bgImage);

        const nickname = userDoc.nickname || 'ななしさん';
        document.getElementById('profName').textContent = nickname;

        // ひとことの処理
        const bio = (userDoc.bio || '').trim();
        if (bio && bio !== 'よろしくお願いします！') {
          document.getElementById('profBio').textContent = bio;
          document.getElementById('profBio').style.display = 'block';
        } else {
          document.getElementById('profBio').style.display = 'none';
        }

        const avatarEl = document.getElementById('profAvatar');
        avatarEl.textContent = nickname[0];
        avatarEl.style.background = avatarColor(nickname);

        // からくり人形表示
        const famKey = userDoc.famType || 'tora';
        const f = FAM_TYPES[famKey] || FAM_TYPES.tora;
        document.getElementById('famIcon').innerHTML = famImg(famKey, 36);
        document.getElementById('famTitle').textContent = `からくり：${f.name}`;

        // からくり人形のセリフ (すきなもの連動)
        let talkMsg = `「${f.greet}」`;
        const hobbies = Array.isArray(userDoc.hobbies) ? userDoc.hobbies : [];
        if (hobbies.length > 0) {
          const randHobbyObj = hobbies[Math.floor(Math.random() * hobbies.length)];
          const hobbyName = typeof randHobbyObj === 'object' ? randHobbyObj.text : randHobbyObj;
          talkMsg = `「${nickname}は${hobbyName}が好きです」`;
        } else {
          talkMsg = `「${f.noHobby || '好きなものはまだ設定されていません'}」`;
        }
        document.getElementById('famMsg').textContent = talkMsg;
        document.getElementById('famBox').style.display = 'flex';

        // 統計情報の算出・表示
        const learnedTerms = Array.isArray(userDoc.learnedTermKeys) ? userDoc.learnedTermKeys : [];
        const unlockedAchievements = Array.isArray(userDoc.unlockedAchievements) ? userDoc.unlockedAchievements : [];

        const termsCount = learnedTerms.length;
        const totalTerms = 50; // ナレッジブック総数
        const termsPercent = Math.min(100, Math.round((termsCount / totalTerms) * 100));

        const achievementsCount = unlockedAchievements.length;
        const totalAchievements = 5; // 実績総数
        const achievementsPercent = Math.min(100, Math.round((achievementsCount / totalAchievements) * 100));

        const rankName = calculateRank(termsCount, works.length, achievementsCount);

        // プロフィールに統計情報を追加描画
        const statsHtml = `
          <div style="margin-top: 15px; display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; font-weight: 800;">
            <span style="background: #FBF3E1; border: 1.5px solid var(--line); border-radius: 0; padding: 4px 10px; box-shadow:none;">👑 ランク: ${rankName}</span>
            <span style="background: #F3EAD3; border: 1.5px solid var(--line); border-radius: 0; padding: 4px 10px; box-shadow:none;">📖 ナレッジベース達成率: ${termsPercent}% (${termsCount}/${totalTerms})</span>
            <span style="background: #E7ECE3; border: 1.5px solid var(--line); border-radius: 0; padding: 4px 10px; box-shadow:none;">🏆 実績達成度: ${achievementsPercent}% (${achievementsCount}/${totalAchievements})</span>
          </div>
        `;
        document.getElementById('profileCard').querySelector('.profile-info').insertAdjacentHTML('beforeend', statsHtml);
      }
      document.getElementById('profileCard').style.display = 'flex';

      // 2. 公開作品のグリッド描画(civitai風カード)
      const grid = document.getElementById('worksGrid');
      grid.innerHTML = '';

      if (works && works.length > 0) {
        works.forEach(w => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = `index.html?work=${w.id}`;

          let thumbInner = `<span style="font-size:48px;">🎮</span>`;
          if (w.thumbnail) {
            thumbInner = `<img src="${w.thumbnail}" alt="" loading="lazy">`;
          }

          card.innerHTML = `
            <div class="thumb">
              ${thumbInner}
              <div class="card-overlay">
                <div class="cf-title">${esc(w.title)}</div>
                <div class="cf-row">
                  <span class="cf-stats"><span>▶ ${w.playCount || 0}</span><span>♥ ${w.likeCount || 0}</span></span>
                </div>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
        document.getElementById('worksSection').style.display = 'block';
      } else {
        const emptyWrap = document.createElement('div');
        emptyWrap.className = 'empty-state';
        emptyWrap.textContent = '公開中の作品はありません。';
        grid.parentNode.replaceChild(emptyWrap, grid);
        document.getElementById('worksSection').style.display = 'block';
      }

      document.getElementById('loading').style.display = 'none';
    } catch (e) {
      console.error('Failed to load author profile and works:', e);
      document.getElementById('loading').innerHTML = '❌ データの読み込みに失敗しました。';
      isInitialized = false;
    }
  }

  // 認証状態の変化を監視
  window.addEventListener('vibecoding-auth-change', () => {
    init();
  });

  // ロード完了時に一度実行してみる
  window.addEventListener('DOMContentLoaded', () => {
    init();
  });
</script>
<script src="sidebar-toggle.js?v=1.0.1"></script>
</body>
</html>
